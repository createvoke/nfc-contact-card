      margin: 8px 0 4px;

      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;

      background: #fafafa;

      border-radius: 12px;
      margin-top: 18px;
      font-size: 0.95rem;
      line-height: 1.45;
      border-left: 4px solid #007aff;
    }

    .footer {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #777;
    }

    .footer img {
      height: 18px;
      margin-left: 4px;
