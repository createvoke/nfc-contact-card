<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DJ Bikki | Aayo Gorkhali Events | Digital Business Card</title>
  <style>
    :root{
      --card-bg: #ffffff;
      --page-bg: #f9f9f9;
      --accent: #007aff;
      --muted: #666;
      --shadow: rgba(0,0,0,0.06);
      --maxw: 420px;
    }
    html,body{height:100%;margin:0}
    body{
      font-family: "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial;
      background:var(--page-bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      color:#1a1a1a;
    }

    .card{
      width:100%;
      max-width:var(--maxw);
      background:var(--card-bg);
      border-radius:14px;
      padding:20px 18px;
      box-shadow:0 12px 30px var(--shadow);
      text-align:center;
    }

    .photo{
      width:180px;
      height:180px;
      max-width:60%;
      object-fit:cover;
      border-radius:8px;
      display:block;
      margin:0 auto 12px;
      box-shadow:0 6px 18px rgba(0,0,0,0.08);
    }

    h1{font-size:1.3rem;margin:6px 0 2px;line-height:1.1}
    h2{font-size:0.95rem;color:var(--muted);margin:0 0 10px}

    .contact-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      background:#f2f6ff;border-radius:10px;padding:8px 12px;
      color:#0256c9;text-decoration:none;font-weight:600;font-size:0.95rem;
      box-shadow:inset 0 -1px 0 rgba(0,0,0,0.02);
    }

    a.pill{color:#0256c9}

    .button{
      display:inline-block;margin-top:12px;background:var(--accent);
      color:white;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600;
      box-shadow:0 6px 16px rgba(0,122,255,0.15);
    }

    .note{
      margin-top:16px;text-align:left;font-size:0.95rem;line-height:1.45;color:#333;
      max-width:360px;margin-left:auto;margin-right:auto;
    }
    .note ul{padding-left:18px;margin:8px 0}
    .note li{margin:6px 0}

    .footer{margin-top:18px;color:#999;font-size:0.82rem}
    .footer img{height:18px;vertical-align:middle;margin-left:6px}

    @media (max-width:420px){
      .photo{width:160px;height:160px}
      .logo{max-width:100px}
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- main photo/logo to embed in vCard (displayed on page) -->
    <img class="photo" src="https://raw.githubusercontent.com/createvoke/nfc-contact-card/main/djbikki/SQUARE.png" alt="DJ Bikki" />

    <h1>DJ Bikki</h1>
    <h2>Aayo Gorkhali Events</h2>

    <div class="contact-row">
      <a class="pill" href="tel:+61416838672">📞 +61 416 838 672</a>
      <a class="pill" href="mailto:bikkichitrakar@gmail.com">✉️ Email</a>
    </div>

    <div class="contact-row">
      <a class="pill" href="https://www.instagram.com/chitrakarbikki?igsh=MXF1Nnp5MWJpaWhzOQ==" target="_blank">Instagram</a>
      <a class="pill" href="https://www.facebook.com/share/15RNATeckuS/?mibextid=wwXIfr" target="_blank">Facebook</a>
      <a class="pill" href="https://www.tiktok.com/@djbikkichitrakar?_r=1&_t=ZS-91NZLYUXTXz" target="_blank">TikTok</a>
    </div>

    <!-- vCard download (upload DJ_Bikki.vcf to same folder) -->
    <a class="button" href="DJ_Bikki.vcf" download>📲 Add to Contacts</a>

    <div class="note">
        <li>🎧 DJ hire for all events.</li>
        <li>🔊 Sound System Rent & DJ services for private parties.</li>
        <li>📋 Organise and Coordination for large events via Aayo Gorkhali Events.</li>
      </ul>
    </div>

    <div class="footer">
      powered by Createvoke
      <img src="https://raw.githubusercontent.com/createvoke/nfc-contact-card/main/createvoke-logo.png" alt="Createvoke logo" />
    </div>
  </div>
</body>
</html>
